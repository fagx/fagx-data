name: validate

# Every PR: JSON schemas for the institutional list, envelope integrity,
# sign/verify round-trip with the solo-test key, shrink guard, simulated
# quota budget, secret scan, unit tests, and full pipeline dry-runs
# against the Firestore emulator with fixtures (v0.1 list pipeline and
# v0.2 aggregation track, including security-rules enforcement).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static:
    name: schemas, envelope, guards, quota, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Static validation (node run.js ci)
        run: node run.js ci

  dry-run:
    name: pipeline dry-run (Firestore emulator + fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Java (required by the Firestore emulator) is preinstalled on ubuntu-latest.
      - name: Dry-run against Firestore emulator with fixtures
        run: >-
          npx -y firebase-tools@latest emulators:exec
          --only firestore
          --project fagx-dry-run
          "node run.js dry-run"

  dry-run-v02:
    name: v0.2 track dry-run (rules enforcement + aggregation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - name: Install dependencies
        run: npm ci
      # One emulator session loads firestore.rules and runs both v0.2
      # stages: the security-rules enforcement probes and the incremental
      # aggregation dry-run (F-04 window prune + F-03 adaptive deletes).
      - name: Rules enforcement + v0.2 aggregation against Firestore emulator
        run: >-
          npx -y firebase-tools@latest emulators:exec
          --only firestore
          --project fagx-dry-run
          "node run.js rules-test && node run.js dry-run-v02"
